name: Verify rollback journal
on:
  push:
    branches: [verify-preserve-rollback-journal]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins/rust-search
      - name: Test journal parsing
        run: cargo test --locked -p winrust-common journal::tests
      - name: Build plugins and installer
        run: powershell -ExecutionPolicy Bypass -File scripts\build-all.ps1
