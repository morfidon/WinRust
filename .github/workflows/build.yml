name: Verify Explorer opt-in
on:
  push:
    branches: [verify-explorer-opt-in]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins/rust-search
      - name: Build plugins and installer
        run: powershell -ExecutionPolicy Bypass -File scripts\build-all.ps1
      - name: Test installer selection
        run: cargo test --locked -p plugin-launcher --test install-selection
