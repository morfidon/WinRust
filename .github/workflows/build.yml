name: Verify service settings rollback
on:
  push:
    branches: [verify-restore-service-settings]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins/rust-search
      - name: Build plugins and installer
        run: powershell -ExecutionPolicy Bypass -File scripts\build-all.ps1
      - name: Test service settings rollback with a simulated registry
        run: cargo test --locked -p plugin-launcher --test explorer-service-settings
