# Verification run for the registry-test cleanup.
name: build
on:
  push:
    branches: [codex/verify-non-destructive-registry-tests]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins/rust-search
      - name: Build all (plugins, payload, installer)
        run: powershell -ExecutionPolicy Bypass -File scripts\build-all.ps1
      - name: Test workspace
        run: cargo test --workspace
      - name: Test rust-search
        run: cargo test
        working-directory: plugins/rust-search
